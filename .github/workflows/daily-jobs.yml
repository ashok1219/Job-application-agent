name: Daily QA Job Alerts

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Discover jobs and email report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          JOB_PROFILE_JSON: ${{ secrets.JOB_PROFILE_JSON }}
        run: |
          if [ -n "$JOB_PROFILE_JSON" ]; then
            printf '%s' "$JOB_PROFILE_JSON" > profile.json
          fi
          python job_agent.py

      - name: Upload HTML report
        if: always() && hashFiles('daily_jobs.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-report
          path: daily_jobs.html
          retention-days: 7